@if (error) {
  <my-alert type="danger">{{ error }}</my-alert>
}

<form (ngSubmit)="changePassword()" [formGroup]="form">

  <label i18n for="current-password">Change password</label>
  <my-input-text
    formControlName="current-password" inputId="current-password" i18n-placeholder placeholder="Current password"
    [formError]="formErrors['current-password']" autocomplete="current-password"
  ></my-input-text>

  <my-input-text
    formControlName="new-password" inputId="new-password" i18n-placeholder placeholder="New password"
    [formError]="formErrors['new-password']" autocomplete="new-password"
  ></my-input-text>

  <my-input-text
    formControlName="new-confirmed-password" inputId="new-confirmed-password" i18n-placeholder placeholder="Confirm new password"
    [formError]="formErrors['new-confirmed-password']" autocomplete="new-password"
  ></my-input-text>

  <input class="mt-3 peertube-button primary-button" type="submit" i18n-value value="Change password" [disabled]="!form.valid">
</form>

<div class="mt-4">
  @if (setPasswordEmailSent) {
    <my-alert type="success" i18n>An email with a link to set your password has been sent to {{ user?.email }}.</my-alert>
  } @else {
    <p class="text-muted mb-2" i18n>Don't have a password yet (e.g. you signed in with an email link)? We can email you a link to set one.</p>
    <button type="button" class="peertube-button secondary-button" (click)="askToSetPassword()" i18n>Email me a link to set a password</button>
  }
</div>
